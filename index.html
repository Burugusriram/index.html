<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #0f172a;
    color: #fff;
    margin: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    text-align: center;
  }
  .profile {
    margin-bottom: 30px;
  }
  .avatar {
    width: 90px;
    height: 90px;
    background: linear-gradient(135deg, #06b6d4, #3b82f6);
    border-radius: 50%;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 26px;
    color: #fff;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }
  p {
    font-size: 13px;
    color: #a1a1aa;
  }
  .job-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .job {
    display: block;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px;
    color: #fff;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .job:hover {
    background: rgba(255,255,255,0.15);
    transform: scale(1.02);
  }
  .job-title {
    font-size: 15px;
    font-weight: 600;
  }
  .job-company {
    font-size: 13px;
    color: #a1a1aa;
  }
  .footer {
    margin-top: 30px;
    font-size: 12px;
    color: #64748b;
  }
</style>
</head>
